name: wpl

services:
  backend:
    image: wpl-backend:dev
    build:
      context: .
      dockerfile: backend/Dockerfile
    network_mode: host
    restart: unless-stopped
    env_file:
      - backend/.env
    environment:
      WPL_DATABASE_PATH: /data/wpl.db
      DOCKER_HOST: unix:///var/run/docker.sock
    volumes:
      - type: bind
        source: ./data
        target: /data
        bind:
          create_host_path: false
      - type: bind
        source: /var/run/docker.sock
        target: /var/run/docker.sock
        bind:
          create_host_path: false
    command:
      - /bin/sh
      - -c
      - >-
        python -m alembic upgrade head &&
        exec python -m uvicorn backend.app.main:app
        --host 127.0.0.1 --port 8000
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import requests; requests.get('http://127.0.0.1:8000/health', timeout=5).raise_for_status()"
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

  web:
    image: wpl-web:dev
    build:
      context: .
      dockerfile: frontend/Dockerfile
      args:
        VITE_API_URL: "${WPL_PUBLIC_URL}/api"
        VITE_SUPABASE_URL: "${SUPABASE_URL}"
        VITE_SUPABASE_PUBLISHABLE_KEY: "${SUPABASE_PUBLISHABLE_KEY}"
    network_mode: host
    restart: unless-stopped
    environment:
      WPL_LISTEN_ADDRESS: "${WPL_LISTEN_ADDRESS:-127.0.0.1}"
      WPL_HTTP_PORT: "${WPL_HTTP_PORT:-8080}"
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test:
        - CMD-SHELL
        - 'wget -q -O /dev/null "http://127.0.0.1:$${WPL_HTTP_PORT}/"'
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
